# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The tests and samples multi-target net8.0-net10.0, so every runtime must be present.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Pack
      run: dotnet pack src/EntityLengths.Generator -c Release -o artifacts
    - name: Check the package declares no dependencies
      # An analyzer package must not put Roslyn (or anything else) in its dependency graph: it would
      # force its version range onto every consumer and break restores that pull Roslyn in through
      # another package, such as Microsoft.EntityFrameworkCore.Design (NU1107 / NU1608).
      run: |
        unzip -p artifacts/*.nupkg '*.nuspec' > package.nuspec
        if grep -q '<dependency ' package.nuspec; then
          echo "The package must not declare dependencies, found:"
          grep '<dependency ' package.nuspec
          exit 1
        fi
